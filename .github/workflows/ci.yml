name: CI

on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: "0 6 * * *"  # worker quotidien 06:00 UTC — runner gratuit = traitement 0 $
  workflow_dispatch:

jobs:
  pipeline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r pipeline/requirements.txt
      - run: ruff check pipeline/
      - run: cd pipeline && python -m pytest tests/ -q

  api-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r apps/api/requirements.txt
      - run: python -c "import ast, pathlib; ast.parse(pathlib.Path('apps/api/main.py').read_text())"

  worker-run:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r pipeline/requirements.txt
      - run: python -m housat.worker --once
        working-directory: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
