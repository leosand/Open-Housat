name: CI

on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  pipeline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r pipeline/requirements.txt
      - run: ruff check pipeline/
      - run: cd pipeline && python -m pytest tests/ -q

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r pipeline/requirements.txt -r apps/api/requirements.txt
      - run: rm -f test-housat.db && python -m pytest apps/api/tests -q
        env:
          PYTHONPATH: pipeline:apps/api
          HOUSAT_DATABASE_URL: sqlite:///./test-housat.db

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: apps/web

  worker-run:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r pipeline/requirements.txt
      - run: python -m housat.worker --once
        working-directory: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
