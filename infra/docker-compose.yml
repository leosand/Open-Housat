services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: housat
      POSTGRES_PASSWORD: housat
      POSTGRES_DB: housat
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housat"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../.env
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    user: "1000:1000"  # non-root
    restart: unless-stopped

  worker:
    build:
      context: ../pipeline
      dockerfile: Dockerfile
    env_file: ../.env
    depends_on:
      db: {condition: service_healthy}
    command: ["python", "-m", "housat.worker", "--once"]
    user: "1000:1000"
    profiles: ["manual"]  # en prod : cron GitHub Actions (0 $), voir .github/workflows

volumes:
  pgdata:
  miniodata:
