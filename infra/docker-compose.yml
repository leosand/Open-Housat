services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: housat
      POSTGRES_PASSWORD: housat
      POSTGRES_DB: housat
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housat"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      HOUSAT_DATABASE_URL: postgresql+psycopg2://housat:housat@db:5432/housat
      DATABASE_URL: postgresql+psycopg2://housat:housat@db:5432/housat
      # Surresolution d'affichage servie en ONNX (modele livre dans l'image api).
      SR_MODEL_PATH: /srv/pipeline/housat/models/housat_sr_x4.onnx
      DISPLAY_SR_ENGINE: onnx
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    restart: unless-stopped

  worker:
    build:
      context: ../pipeline
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://housat:housat@db:5432/housat
      SR_MODEL_PATH: /srv/housat/models/housat_sr_x4.onnx
      DISPLAY_SR_ENGINE: onnx
    depends_on:
      db: {condition: service_healthy}
    profiles: ["manual"]  # usage : docker compose -f infra/docker-compose.yml run --rm worker
    # ou docker compose ... run --rm worker python -m housat.worker --backfill 1

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on: [api]
    ports: ["8080:80"]
    restart: unless-stopped

volumes:
  pgdata:
